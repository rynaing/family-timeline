name: Family backup

# Weekly encrypted backup of the family's entries, people and photos.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   FAMILY_ID          the family's id (its read key)
#   BACKUP_PASSPHRASE  a long passphrase; the backup is useless without it
# The repo is public, so the backup is encrypted before it is uploaded.
on:
  schedule:
    - cron: "17 9 * * 0"   # Sundays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check secrets
        env:
          FAMILY_ID: ${{ secrets.FAMILY_ID }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$FAMILY_ID" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the FAMILY_ID and BACKUP_PASSPHRASE repository secrets to turn on backups."
            exit 1
          fi
          if [ ${#BACKUP_PASSPHRASE} -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE should be at least 16 characters."
            exit 1
          fi
      - run: npm install --no-save --no-package-lock @supabase/supabase-js@2
      - name: Download family data
        env:
          FAMILY_ID: ${{ secrets.FAMILY_ID }}
        run: node scripts/backup.mjs
      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="family-backup-$(date -u +%Y-%m-%d)"
          tar czf "$name.tar.gz" backup
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf backup "$name.tar.gz"
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 90
